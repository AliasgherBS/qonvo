global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The Qonvo API renders both its own HTTP metrics AND the worker's
  # business/pipeline metrics (via Redis) — one target covers the app.
  - job_name: qonvo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Host CPU / memory / disk — watch the VPS resource budget.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
