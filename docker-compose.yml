# Qonvo — single-VPS Docker Compose stack (DESIGN.md §2, §12).
# Validate without starting: `docker compose config`.

name: qonvo

x-backend-env: &backend-env
  env_file:
    - .env

services:
  # --------------------------------------------------------------------- #
  # WhatsApp layer
  # --------------------------------------------------------------------- #
  waha:
    # Full image (Chromium + both engines), pinned. We run the NOWEB engine
    # (WHATSAPP_DEFAULT_ENGINE below) — WEBJS in 2026.6.2 crashed parsing inbound
    # message IDs and dropped every message; 2026.7.2 also fixes NOWEB's stale
    # WhatsApp-Web version detection (the handshake "Connection Failure").
    image: devlikeapro/waha:latest-2026.7.2
    restart: unless-stopped
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      # NO global webhook here — deliberately. Webhooks are configured
      # PER SESSION (with a per-session HMAC key) via POST /api/sessions (§5.1).
      # A global hook on the same URL is unsigned, and WAHA dedupes hooks by
      # URL, so it can shadow the signed session hook → every delivery 401s.
      WHATSAPP_DEFAULT_ENGINE: ${QONVO_WAHA_DEFAULT_ENGINE:-WEBJS}
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    ports:
      # Dev-only: WAHA dashboard/Swagger on localhost. Internal traffic uses the
      # compose network (http://waha:3000). Never expose publicly.
      - "127.0.0.1:${WAHA_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------- #
  # Datastores
  # --------------------------------------------------------------------- #
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Non-superuser app role (created on first init; superusers bypass RLS)
      APP_DB_USER: ${APP_DB_USER:-qonvo_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SYSTEM_DB_USER: ${SYSTEM_DB_USER:-qonvo_system}
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------------------- #
  # Application
  # --------------------------------------------------------------------- #
  api:
    build:
      context: ./backend
    restart: unless-stopped
    <<: *backend-env
    # Apply migrations, then serve. Single replica → no migration race.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      waha:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    <<: *backend-env
    command: ["arq", "app.workers.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      waha:
        condition: service_started
      api:
        condition: service_started

  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    <<: *backend-env
    command: ["arq", "app.workers.scheduler.SchedulerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      waha:
        condition: service_started
      api:
        condition: service_started

  # Built by the dashboard agent; entry included so the stack is complete.
  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started

  # --------------------------------------------------------------------- #
  # Edge: TLS + reverse proxy
  # --------------------------------------------------------------------- #
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      dashboard:
        condition: service_started

volumes:
  waha_sessions:
  waha_media:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
