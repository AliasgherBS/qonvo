# Dev-only overrides (auto-merged by `docker compose` when present).
# Exposes datastores on localhost for running migrations/tests from the host.
# Ports are variables so a second stack (staging, see qonvo-staging.sh) can run
# beside this one on the same box without colliding.
# Do NOT deploy this file to production hosts.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
  api:
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
