[project]
name = "qonvo-backend"
version = "0.1.0"
description = "Qonvo — AI customer representative on WhatsApp. Phase 0 backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "cryptography>=44.0",
    "pyjwt>=2.10",
    "loguru>=0.7",
    "python-multipart>=0.0.20",
    "passlib[argon2]>=1.7.4",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "pydantic[email]>=2.9",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "fakeredis>=2.26",
    "aiosqlite>=0.20",
    "ruff>=0.9",
    "lupa>=2.8",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"app/alembic/versions/*" = ["E501"]
"tests/*" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "postgres: requires a live Postgres with pgvector (set QONVO_TEST_DATABASE_URL)",
]
