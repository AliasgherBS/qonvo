# UI tests, on demand.
#
# The per-pull-request path lives in ci.yml, not here, because auto-merge
# `needs` cannot name a job in another workflow -- so a suite that ran as its
# own workflow could only ever be advisory, and a broken billing page would
# merge itself. This file is what remains: running any module, against any
# environment, when a person asks for it.
name: UI tests (on demand)

on:
  workflow_dispatch:
    inputs:
      module:
        description: Which suite to run
        required: true
        default: smoke
        type: choice
        options: [smoke, billing, knowledge, inbox, settings, analytics, responsive, all]
      base:
        description: Target base URL (defaults to staging)
        required: false
        type: string

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Which suites does this change need?
    runs-on: ubuntu-latest
    outputs:
      grep: ${{ steps.pick.outputs.grep }}
      label: ${{ steps.pick.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        name: Which suite was asked for?
        env:
          CHOICE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          case "$CHOICE" in
            all) echo "grep=." >> "$GITHUB_OUTPUT" ;;
            *)   echo "grep=@$CHOICE" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "label=$CHOICE (requested)" >> "$GITHUB_OUTPUT"


  ui:
    name: Run ${{ needs.select.outputs.label }}
    needs: select
    if: needs.select.outputs.grep != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: e2e/package-lock.json }

      - name: Is the target reachable?
        id: reach
        env:
          BASE: ${{ inputs.base || vars.QONVO_E2E_BASE || 'https://dev.qonvo.org' }}
        run: |
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if curl -sSf -m 20 -o /dev/null "$BASE"; then
            echo "up=1" >> "$GITHUB_OUTPUT"
          else
            echo "up=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=UI tests skipped::$BASE is unreachable, so no UI test ran for this change."
          fi

      - if: steps.reach.outputs.up == '1'
        working-directory: e2e
        run: npm ci

      - if: steps.reach.outputs.up == '1'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - if: steps.reach.outputs.up == '1'
        working-directory: e2e
        env:
          QONVO_E2E_BASE: ${{ steps.reach.outputs.base }}
          QONVO_E2E_API: ${{ vars.QONVO_E2E_API || 'https://dev-api.qonvo.org' }}
          QONVO_E2E_OWNER_EMAIL: ${{ secrets.QONVO_E2E_OWNER_EMAIL }}
          QONVO_E2E_OWNER_PASSWORD: ${{ secrets.QONVO_E2E_OWNER_PASSWORD }}
        run: npx playwright test --grep "${{ needs.select.outputs.grep }}"

      - if: always() && steps.reach.outputs.up == '1'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
